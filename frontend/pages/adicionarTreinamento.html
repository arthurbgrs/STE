<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Adicionar Treinamento</title>
<link rel="stylesheet" href="../css/adicionarTreinamento.css">
</head>

<body>

<header>
    <div class="">
        <img src="">
    </div>

    <nav>
        <a href="/frontend/pages/paginainicial.html">HOME</a>
        <a href="/frontend/pages/gerenciarFuncionario.html">FUNCIONÁRIOS</a>
        <a href="/frontend/pages/adicionarTreinamento.html">TREINAMENTOS</a>
    </nav>
</header>


<div class="container">

<h2>ADICIONAR TREINAMENTO AO FUNCIONÁRIO</h2>

<form id="addTrainingForm">

<label for="funcionarioSelect">Funcionário</label>
<select id="funcionarioSelect" required>
  <option value="">Selecione um funcionário</option>
</select>

<label for="treinamentoNome">Nome do treinamento</label>
<input id="treinamentoNome" type="text" placeholder="Nome do treinamento" required>

<label for="categoria">Categoria</label>
<input id="categoria" type="text" placeholder="Categoria (ex: Segurança, RH)" required>

<label for="cargaHoraria">Carga horária (horas)</label>
<input id="cargaHoraria" type="number" min="0" step="0.5" placeholder="Ex: 8" required>

<label for="validade">Validade do treinamento</label>
<input id="validade" type="date" required>

<label for="detalhes">Detalhes (opcional)</label>
<textarea id="detalhes" rows="3" placeholder="Observações sobre o treinamento"></textarea>

<div class="botoes">

<button type="submit" class="salvar">
Salvar treinamento
</button>

<button type="reset" class="limpar">
Limpar campos
</button>

</div>

</form>

<div id="message" role="status" aria-live="polite"></div>

</div>


<footer>
© Todos os direitos reservados
</footer>

<script src="../js/adicionarTreinamento.js"></script>
</body>
</html>
