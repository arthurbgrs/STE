<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treinamentos Atribuídos</title>
<link rel="stylesheet" href="../css/atribuidosTreinamentos.css">
</head>

<body>

<header class="topo">
<nav class="menu">
<a href="/frontend/pages/paginainicial.html">Home</a>
<a href="/frontend/pages/gerenciarFuncionario.html">Funcionários</a>
<a class="ativo" href="/frontend/pages/adicionarTreinamento.html">Treinamentos</a>
</nav>
</header>

<main class="pagina">

<section class="perfil-card">
<div class="perfil-foto">
<img id="funcionarioFoto" alt="Foto do funcionário">
<span id="fotoPlaceholder" class="foto-placeholder">F</span>
</div>

<div class="perfil-info">
<h1 id="funcionarioNome">Funcionário</h1>
<p id="funcionarioDepartamento">Departamento</p>

<div class="perfil-status">
<div class="status-item status-ok">
<span class="status-bolinha"></span>
<span>Ativo</span>
</div>
<div class="status-item status-vencido">
<span class="status-icone">!</span>
<span><strong id="totalVencidos">0</strong> Vencidos</span>
</div>
<div class="status-item status-pendente">
<span class="status-icone">!</span>
<span><strong id="totalPendentes">0</strong> Pendentes</span>
</div>
</div>
</div>
</section>

<section class="cabecalho-tabela">
<h2>Treinamentos Atribuídos</h2>

<div class="busca">
<span class="busca-icone">⌕</span>
<input id="searchInput" type="text" placeholder="Buscar treinamento...">
</div>
</section>

<section class="tabela-card">
<table>
<thead>
<tr>
<th>Treinamento</th>
<th>Status</th>
<th>Vencimento</th>
</tr>
</thead>

<tbody id="treinamentosBody"></tbody>
</table>
</section>

<div class="rodape-conteudo">
<button class="voltar">Voltar</button>
<p id="resumoTreinamentos" class="resumo-treinamentos">0 treinamentos</p>
</div>

</main>

<footer>© 2026 Todos os direitos reservados</footer>

<script src="../js/atribuidosTreinamentos.js"></script>
</body>
</html>
