<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Funcionário</title>
    <link rel="stylesheet" href="../css/detalhes.css" />
  </head>

  <body>
    <header class="header">
      <nav class="menu">
                <a href="/frontend/pages/paginainicial.html">HOME</a>
        <a href="/frontend/pages/gerenciarFuncionario.html">FUNCIONÁRIOS</a>
        <a href="/frontend/pages/adicionarTreinamento.html">TREINAMENTOS</a>
      </nav>
    </header>

    <main class="container">
      <div class="perfil">
        <img
          id="fotoFuncionario"
          class="foto"
          src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
          alt="Foto do funcionário"
        />

        <h3 id="nomeFuncionario">Nome do funcionário</h3>
      </div>

      <div class="informacoes">
        <div class="lado-esquerdo">
          <p id="cpfFuncionario">CPF: -</p>
          <p id="telefoneFuncionario">📞 -</p>
          <p id="emailFuncionario">✉ -</p>
        </div>

        <div class="linha"></div>

        <div class="lado-direito">
          <p id="cargoFuncionario">Cargo: -</p>
          <p id="departamentoFuncionario">Departamento: -</p>
        </div>
      </div>

      <section class="detalhes">
        <h2>Detalhes</h2>
        <textarea class="textarea-custom" name="" id="detalhesFuncionario" readonly></textarea>
      </section>

      <div class="botoes">
        <button id="editarFuncionario" class="editar">✏ Editar</button>

        <button id="excluirFuncionario" class="excluir">🗑 Excluir</button>
      </div>
    </main>

    <footer class="footer">© Todos os direitos reservados</footer>

    <script src="../js/detalhes.js"></script>
  </body>
</html>
