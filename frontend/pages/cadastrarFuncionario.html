<!DOCTYPE html>

<header>

    <nav>
          <a href="/frontend/pages/paginainicial.html">HOME</a>

<div class="container">

<h2>CADASTRAR FUNCIONÁRIO</h2>

id="cpf"

placeholder="123-456-789-01"

>

<option value="Recrutamento e Seleção">Recrutamento e Seleção</option>
<option value="Cargos e Salários">Cargos e Salários</option>
<option value="Financeiro">Financeiro</option>
<option value="Contabilidade">Contabilidade</option>
<option value="Controladoria">Controladoria</option>
<option value="Tesouraria">Tesouraria</option>
<option value="Faturamento">Faturamento</option>
<option value="Cobrança">Cobrança</option>
<option value="Comercial">Comercial</option>
<option value="Marketing">Marketing</option>
<option value="Pós-vendas">Pós-vendas</option>
<option value="Atendimento ao Cliente">Atendimento ao Cliente</option>
<option value="E-commerce">E-commerce</option>
<option value="Produção">Produção</option>
<option value="Logística">Logística</option>
<option value="Suprimentos">Suprimentos</option>
<option value="Controle de Qualidade">Controle de Qualidade</option>
<option value="Manutenção">Manutenção</option>
<option value="Tecnologia da Informação">Tecnologia da Informação</option>
<option value="Desenvolvimento de Sistemas">Desenvolvimento de Sistemas</option>
<option value="Segurança da Informação">Segurança da Informação</option>
<option value="Jurídico">Jurídico</option>
<option value="Compliance">Compliance</option>
<option value="Comunicação Interna">Comunicação Interna</option>
</select>

<label>Cargo</label>
<select id="cargo" required>
<option value="" selected disabled>Selecione um cargo</option>
<option value="Diretor Geral">Diretor Geral</option>
<option value="Gerente de Planejamento">Gerente de Planejamento</option>
<option value="Especialista em Governança">Especialista em Governança</option>
<option value="Gerente de RH">Gerente de RH</option>
<option value="Analista de DP">Analista de DP</option>
<option value="Analista de T&D">Analista de T&amp;D</option>
<option value="Recrutador">Recrutador</option>
<option value="Analista de Remuneração">Analista de Remuneração</option>
<option value="Gerente Financeiro">Gerente Financeiro</option>
<option value="Contador">Contador</option>
<option value="Controller">Controller</option>
<option value="Tesoureiro">Tesoureiro</option>
<option value="Analista de Faturamento">Analista de Faturamento</option>
<option value="Analista de Cobrança">Analista de Cobrança</option>

<label>Nº TELEFONE</label>
<input id="telefone" type="text" inputmode="numeric" maxlength="11" required>

<label>Email</label>
<input id="email" type="email" placeholder="nome@empresa.com" required>

<div class="linha">

<div class="detalhes">
<label>Detalhes</label>
<textarea id="detalhes" placeholder="Alguns detalhes sobre o treinamento"></textarea>
</div>

<div class="foto-area">
<label>Foto</label>

<div class="upload-foto">
<input type="file" id="foto" accept="image/*">
<label for="foto" class="botao-foto">Escolher foto</label>
<span id="nome-arquivo" class="nome-arquivo">Nenhum arquivo escolhido</span>
</div>

<div class="preview">
<img id="preview-img" src="">
</div>

</div>

</div>

<div class="botoes">
<button type="submit" class="criar">Criar</button>
<button id="cancelarCadastro" class="cancelar" type="button">Cancelar</button>
</div>

</form>

</div>

<footer>
© Todos os direitos reservados
</footer>


<script>

const inputFoto = document.getElementById("foto");
const preview = document.getElementById("preview-img");
const nomeArquivo = document.getElementById("nome-arquivo");

inputFoto.addEventListener("change", function(){

    const arquivo = this.files[0];

    if(arquivo){
        nomeArquivo.textContent = arquivo.name;
        const reader = new FileReader();

        reader.addEventListener("load", function(){
            preview.src = reader.result;
        });

        reader.readAsDataURL(arquivo);
    } else {
        nomeArquivo.textContent = "Nenhum arquivo escolhido";
        preview.src = "";
    }

});
</script>

<script src="../js/cadastrarFuncionario.js"></script>
</body>
