<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastrar Funcionário</title>
<link rel="stylesheet" href="../css/cadastrarFuncionario.css">
</head>

<body>

<header>
    <div class="logo"></div>

    <nav>
          <a href="/frontend/pages/paginainicial.html">HOME</a>
        <a href="/frontend/pages/gerenciarFuncionario.html">FUNCIONÁRIOS</a>
        <a href="/frontend/pages/adicionarTreinamento.html">TREINAMENTOS</a>
    </nav>
</header>

<div class="container">

<h2>CADASTRAR FUNCIONÁRIO</h2>

<form id="formCadastrarFuncionario">

<label>Nome</label>
<input id="nome" type="text" placeholder="Primeiros socorros" required>

<label>CPF</label>
<input id="cpf" type="text" required>

<label>Departamento</label>
<input id="departamento" type="text" placeholder="Operador de máquinas" required>

<label>Cargo</label>
<input id="cargo" type="text" required>

<label>Nº TELEFONE</label>
<input id="telefone" type="text" required>

<label>Email</label>
<input id="email" type="email" required>

<div class="linha">

<div class="detalhes">
<label>Detalhes</label>
<textarea id="detalhes" placeholder="Alguns detalhes sobre o treinamento"></textarea>
</div>

<div class="foto-area">
<label>Foto</label>

<input type="file" id="foto" accept="image/*">

<div class="preview">
<img id="preview-img" src="">
</div>

</div>

</div>

<div class="botoes">
<button type="submit" class="criar">Criar</button>
<button class="cancelar" type="reset">Cancelar</button>
</div>

</form>

</div>

<footer>
© Todos os direitos reservados
</footer>


<script>

const inputFoto = document.getElementById("foto");
const preview = document.getElementById("preview-img");

inputFoto.addEventListener("change", function(){

    const arquivo = this.files[0];

    if(arquivo){
        const reader = new FileReader();

        reader.addEventListener("load", function(){
            preview.src = reader.result;
        });

        reader.readAsDataURL(arquivo);
    }

});
</script>

<script src="../js/cadastrarFuncionario.js"></script>
</body>
</html>
